@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

/* =====================================================================
   PRESS CHECK
   The chrome is a darkened viewing booth; the artwork is the only lit
   surface. Die-line cyan is reserved for structure and measurement,
   magenta for identity and the one primary action. Nothing else glows.
   ===================================================================== */

html, body { background:#DDE3E9; }

.lp-root{
  /* Light instrument bench: brushed slate chrome, white panel cards,
     the pack lit on a metal plinth. Matches the reference mockup. */
  --ink:#1B2733; --panel:#FFFFFF; --panel2:#F4F6F8; --raise:#E9EDF1;
  --rule:#D5DBE1; --rule2:#E7EBEF;
  --text:#1B2733; --text2:#5A6976; --text3:#8A97A3;
  --paper:#F5F3EE;
  --shell:#C7D0D8; --shell2:#DAE0E6;
  --dieline:#1E9BB8; --seal:#D8318C;
  --mand:#2E9E63; --cond:#C6871B; --recc:#8A97A3;
  --card:var(--panel); --line:var(--rule); --line2:var(--rule2); --ink2:var(--text2); --die:var(--seal);
  font-family:'IBM Plex Sans',ui-sans-serif,system-ui,sans-serif;
  color:var(--text); background:linear-gradient(180deg,#E4E9EE,#CDD5DD); line-height:1.5;
  -webkit-font-smoothing:antialiased;
  height:100vh; overflow:hidden; display:flex; flex-direction:column; position:relative;
}
.lp-root *{ box-sizing:border-box; }
.lp-root ::selection{ background:rgba(63,208,232,0.28); }
.lp-root :focus-visible{ outline:2px solid var(--dieline); outline-offset:2px; border-radius:4px; }

.lp-wrap{ flex:1; min-height:0; display:flex; flex-direction:column; max-width:none; margin:0; padding:0; }

/* ---------- top bar: a fixed instrument header ---------- */
.lp-head{
  flex:none; display:flex; align-items:center; justify-content:space-between; gap:20px;
  padding:0 20px; height:62px; background:var(--panel);
  border-bottom:1px solid var(--rule); margin:0; box-shadow:0 1px 0 rgba(255,255,255,0.6) inset, 0 2px 8px rgba(27,39,51,0.05);
}
.lp-head > div:first-child{ display:flex; align-items:baseline; gap:16px; min-width:0; }
.lp-logo{ font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:21px; letter-spacing:-0.025em; color:var(--text); flex:none; }
.lp-logo em{ font-style:normal; color:var(--seal); }
.lp-logo b{
  font-weight:500; font-size:9.5px; color:var(--text3); margin-left:9px;
  letter-spacing:0.22em; text-transform:uppercase; font-family:'IBM Plex Mono',monospace;
  border-left:1px solid var(--rule); padding-left:9px;
}
.lp-tag{ font-size:12px; color:var(--text3); margin:0; max-width:52ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media (max-width:1180px){ .lp-tag{ display:none; } }
.lp-toolbar{ display:flex; gap:6px; flex:none; }
.lp-tool{
  border:1px solid var(--rule); background:transparent; color:var(--text2);
  border-radius:6px; padding:6px 10px; font-size:11.5px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; font-family:inherit; transition:all .14s;
}
.lp-tool:hover{ border-color:var(--raise); background:var(--panel2); color:var(--text); }
.lp-tool.on{ background:var(--seal); color:#fff; border-color:var(--seal); }

/* ---------- two columns, each scrolling independently ---------- */
.lp-grid{ flex:1; min-height:0; display:grid; grid-template-columns:326px minmax(0,1fr); gap:0; align-items:stretch; }
.lp-panel{
  background:transparent; border:none; border-right:1px solid var(--rule); border-radius:0;
  overflow-y:auto; overscroll-behavior:contain; padding:12px;
}
.lp-panel > .lp-sec{ background:var(--panel); border:1px solid var(--rule); border-radius:12px; margin-bottom:12px; box-shadow:0 2px 8px rgba(27,39,51,0.05); }
.lp-panel > .lp-sec:last-child{ margin-bottom:8px; }
.lp-panel::-webkit-scrollbar, .lp-main::-webkit-scrollbar{ width:9px; }
.lp-panel::-webkit-scrollbar-thumb, .lp-main::-webkit-scrollbar-thumb{ background:var(--raise); border-radius:9px; }
.lp-panel::-webkit-scrollbar-track, .lp-main::-webkit-scrollbar-track{ background:transparent; }

.lp-sec{ padding:15px 16px 16px; border-bottom:none; }
.lp-sec:last-child{ padding-bottom:16px; }
/* A spec sheet names its fields; it does not number them. */
.lp-step{
  display:flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace;
  font-size:9.5px; letter-spacing:0.2em; text-transform:uppercase; color:var(--text3);
  margin-bottom:12px; position:relative; padding-left:11px;
}
.lp-step::before{ content:''; position:absolute; left:0; top:50%; width:4px; height:4px; margin-top:-2px; background:var(--dieline); border-radius:50%; opacity:.75; }
.lp-step i{ display:none; }

.lp-chips, .lp-attrs{ display:flex; flex-wrap:wrap; gap:6px; }
.lp-chip, .lp-attr, .lp-segb{
  border:1px solid var(--rule); background:var(--panel2); color:var(--text2);
  cursor:pointer; transition:all .14s; font-family:inherit;
}
.lp-chip, .lp-attr{ border-radius:6px; padding:7px 11px; font-size:12px; }
.lp-attr{ display:inline-flex; align-items:center; gap:6px; }
.lp-chip:hover, .lp-attr:hover, .lp-segb:hover{ border-color:var(--raise); background:var(--raise); color:var(--text); }
.lp-chip.on, .lp-attr.on{ background:var(--ink); color:#fff; border-color:var(--ink); font-weight:500; }
.lp-attr.on{ background:var(--seal); color:#fff; border-color:var(--seal); }

.lp-seg{ display:flex; flex-wrap:wrap; gap:5px; }
.lp-segb{ border-radius:999px; padding:6px 13px; font-size:11.5px; }
.lp-segb.on{ background:var(--ink); color:#fff; border-color:var(--ink); font-weight:500; }

.lp-fields{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.lp-field{ display:flex; flex-direction:column; gap:4px; min-width:0; } .lp-field.full{ grid-column:1 / -1; }
.lp-field label{ font-size:9.5px; color:var(--text3); font-family:'IBM Plex Mono',monospace; letter-spacing:0.1em; text-transform:uppercase; }
.lp-field input{
  border:1px solid var(--rule); border-radius:6px; padding:8px 10px; font-size:12.5px;
  font-family:'IBM Plex Mono',monospace; color:var(--text); background:#FBFCFD; transition:all .14s;
  width:100%; min-width:0;
}
.lp-field input:hover{ border-color:var(--raise); }
.lp-field input:focus{ outline:none; border-color:var(--dieline); background:#fff; box-shadow:0 0 0 3px rgba(30,155,184,0.16); }

.lp-swlabel{ font-size:9.5px; color:var(--text3); font-family:'IBM Plex Mono',monospace; letter-spacing:0.1em; text-transform:uppercase; margin:14px 0 7px; }
.lp-swatches{ display:flex; gap:7px; flex-wrap:wrap; }
.lp-sw{ width:28px; height:28px; border-radius:6px; cursor:pointer; border:1px solid rgba(255,255,255,0.14); transition:all .14s; position:relative; }
.lp-sw:hover{ transform:translateY(-1px); }
.lp-sw.on{ box-shadow:0 0 0 2px var(--panel), 0 0 0 3px var(--dieline); }

/* ---------- work column ---------- */
.lp-main{ min-width:0; display:flex; flex-direction:column; gap:12px; overflow-y:auto; overscroll-behavior:contain; background:transparent; padding:12px; }
.lp-stage{ background:var(--panel); border:1px solid var(--rule); border-radius:12px; flex:none; overflow:hidden; box-shadow:0 2px 10px rgba(27,39,51,0.06); }
.lp-shead{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:0 16px; height:52px; border-bottom:1px solid var(--rule); background:var(--panel2);
}
.lp-crumb{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text3); display:flex; align-items:center; gap:7px; letter-spacing:0.02em; }
.lp-crumb b{ color:var(--text); font-weight:500; }
.lp-vtoggle{ display:flex; background:var(--panel); border:1px solid var(--rule); border-radius:7px; padding:2px; gap:2px; }
.lp-vt{
  border:1px solid transparent; background:transparent; font-size:11.5px; padding:5px 10px;
  cursor:pointer; display:inline-flex; align-items:center; gap:6px; color:var(--text2);
  font-family:inherit; border-radius:5px; transition:all .14s;
}
.lp-vt:first-child, .lp-vt:last-child, .lp-vt + .lp-vt{ border-radius:5px; border-left:1px solid transparent; }
.lp-vt:hover{ color:var(--text); background:var(--panel2); }
.lp-vt.on{ background:var(--raise); color:var(--text); border-color:var(--rule); }

/* ---------- the lit stage ----------
   Everything inside runs on light tokens so the flat label, the carrier
   view and the sizing rules stay legible on paper. */
.lp-preview{
  --ink:#16243B; --ink2:#4C5A6B; --text:#16243B; --text2:#4C5A6B; --text3:#6E7E90;
  --line:#DCDFDA; --line2:#E8EAE6; --card:#FFFFFF; --bg:#F5F3EE; --die:#C42F84;
  --mand:#0E7A4A; --cond:#B7791F;
  position:relative; padding:26px; background:var(--paper); color:#16243B;
  min-height:340px; border-bottom:none;
}

/* Signature 1: real registration targets at the corners of the lit area. */
.lp-reg{ position:absolute; inset:11px; pointer-events:none; z-index:3; }
.lp-reg i{
  position:absolute; width:11px; height:11px; border:1px solid #16243B; border-radius:50%;
  opacity:0; animation:lp-reg-in .45s cubic-bezier(.2,.7,.2,1) forwards;
}
.lp-reg i::before, .lp-reg i::after{ content:''; position:absolute; background:#16243B; }
.lp-reg i::before{ left:4px; top:-6px; width:1px; height:22px; }
.lp-reg i::after{ top:4px; left:-6px; height:1px; width:22px; }
.lp-reg i:nth-child(1){ left:0; top:0; animation-delay:.02s; }
.lp-reg i:nth-child(2){ right:0; top:0; animation-delay:.07s; }
.lp-reg i:nth-child(3){ left:0; bottom:0; animation-delay:.12s; }
.lp-reg i:nth-child(4){ right:0; bottom:0; animation-delay:.17s; }
@keyframes lp-reg-in{ from{ opacity:0; transform:scale(.55); } to{ opacity:.3; transform:none; } }

/* Signature 2: a control strip whose segment widths are the actual
   mandatory / conditional / recommended counts for this market. */
.lp-strip{ display:flex; align-items:stretch; height:30px; background:var(--panel); border-bottom:1px solid var(--rule); font-family:'IBM Plex Mono',monospace; }
.lp-strip span{
  display:flex; align-items:center; gap:7px; padding:0 11px; font-size:9.5px;
  letter-spacing:0.14em; text-transform:uppercase; color:var(--text3);
  border-right:1px solid var(--rule); overflow:hidden; white-space:nowrap;
  animation:lp-strip-in .4s cubic-bezier(.2,.7,.2,1);
}
.lp-strip span:last-child{ border-right:none; }
.lp-strip span::before{ content:''; width:6px; height:6px; border-radius:1px; flex:none; }
.lp-strip .s-mandatory::before{ background:var(--mand); }
.lp-strip .s-conditional::before{ background:var(--cond); }
.lp-strip .s-recommended::before{ background:var(--recc); }
.lp-strip em{ font-style:normal; color:var(--text); font-weight:600; font-size:11px; }
@keyframes lp-strip-in{ from{ flex-grow:0.01; opacity:0; } to{ opacity:1; } }

.lp-tilt{ perspective:900px; } .lp-tiltinner{ transition:transform .5s cubic-bezier(.2,.7,.2,1); transform-style:preserve-3d; }
.lp-tilt:hover .lp-tiltinner{ transform:rotateY(-10deg) rotateX(4deg); }
.lp-hl{ transform-origin:center; animation:lp-pulse .55s ease; }
@keyframes lp-pulse{ 0%{ opacity:0.2; } 50%{ opacity:1; } 100%{ opacity:1; } }

/* ---------- the ledger ---------- */
.lp-comp{ background:var(--panel); border:1px solid var(--rule); border-radius:12px; padding:18px; box-shadow:0 2px 10px rgba(27,39,51,0.06); }
.lp-comph{
  font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:14px; color:var(--text);
  display:flex; align-items:center; gap:9px; margin-bottom:14px; letter-spacing:-0.01em;
}
.lp-counts{ margin-left:auto; display:flex; gap:7px; font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase; }
.lp-counts em{ font-style:normal; padding:3px 8px; border-radius:4px; font-weight:600; }
.lp-counts em.m{ background:rgba(59,201,138,0.12); color:var(--mand); }
.lp-counts em.c{ background:rgba(224,166,60,0.14); color:var(--cond); }
.lp-crow{
  display:flex; gap:12px; align-items:flex-start; padding:11px 12px; border-radius:7px;
  cursor:pointer; transition:background .14s, box-shadow .14s; border-bottom:1px solid var(--rule2);
  box-shadow:inset 2px 0 0 transparent;
}
.lp-crow:last-of-type{ border-bottom:none; }
.lp-crow:hover{ background:var(--panel); }
.lp-crow.active{ background:var(--panel); box-shadow:inset 2px 0 0 var(--seal); }
.lp-cdot{ width:7px; height:7px; border-radius:50%; margin-top:6px; flex:none; }
.lp-cbody{ min-width:0; flex:1; }
.lp-cn{ font-size:13px; font-weight:500; color:var(--text); }
.lp-cc{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--text3); margin-top:3px; letter-spacing:0.01em; }
.lp-cnote{ font-size:11px; color:var(--cond); margin-top:4px; }
.lp-cst{
  font-family:'IBM Plex Mono',monospace; font-size:8.5px; text-transform:uppercase;
  letter-spacing:0.12em; padding:4px 8px; border-radius:4px; flex:none; margin-top:2px; font-weight:600;
}
.lp-honesty{ margin-top:14px; padding-top:14px; border-top:1px solid var(--rule2); font-size:11px; color:var(--text3); line-height:1.6; }
.lp-preview .lp-honesty, .lp-panel .lp-honesty{ color:var(--text3); }

/* ---------- audit ---------- */
.lp-audit{ background:var(--panel); border:1px solid var(--rule); border-radius:12px; padding:18px; margin:0; color:var(--text); box-shadow:0 2px 10px rgba(27,39,51,0.06); }
.lp-audhead{ font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:14px; display:flex; align-items:center; gap:9px; margin-bottom:13px; color:var(--text); }
.lp-obs{ display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-bottom:1px solid var(--rule2); font-size:12.5px; line-height:1.55; color:var(--text2); }
.lp-obs:last-of-type{ border-bottom:none; }
.lp-obsn{ font-family:'IBM Plex Mono',monospace; font-size:9px; color:var(--cond); border:1px solid var(--cond); border-radius:4px; padding:3px 7px; flex:none; margin-top:1px; letter-spacing:0.1em; }
.lp-audclean{ font-size:12.5px; color:var(--mand); font-family:'IBM Plex Mono',monospace; }
.lp-audnote{ margin-top:13px; padding-top:13px; border-top:1px solid var(--rule2); font-size:11px; color:var(--text3); }

.lp-foot{ flex:none; padding:10px 20px; font-size:9.5px; color:var(--text3); text-align:center; font-family:'IBM Plex Mono',monospace; letter-spacing:0.14em; text-transform:uppercase; border-top:1px solid var(--rule); background:var(--panel); margin:0; }

/* ---------- command palette ---------- */
.lp-palette{ position:fixed; inset:0; background:rgba(6,10,14,0.72); backdrop-filter:blur(6px); z-index:60; display:flex; align-items:flex-start; justify-content:center; padding-top:14vh; animation:lp-fade .15s ease; }
.lp-palbox{ width:min(560px,92vw); background:var(--panel); border:1px solid var(--rule); border-radius:11px; box-shadow:0 30px 80px rgba(0,0,0,0.6); overflow:hidden; }
.lp-palin{ display:flex; align-items:center; gap:11px; padding:16px; border-bottom:1px solid var(--rule); color:var(--text3); }
.lp-palin input{ flex:1; border:none; outline:none; font-size:15px; font-family:'IBM Plex Mono',monospace; color:var(--text); background:transparent; }
.lp-palin kbd, .lp-palhint kbd{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; background:var(--raise); border:1px solid var(--rule); border-radius:4px; padding:3px 6px; color:var(--text2); }
.lp-palmatch{ display:flex; flex-wrap:wrap; gap:6px; padding:13px 16px; border-bottom:1px solid var(--rule); }
.lp-paltag{ background:rgba(63,208,232,0.1); color:var(--dieline); border:1px solid rgba(63,208,232,0.4); font-family:'IBM Plex Mono',monospace; font-size:10.5px; border-radius:5px; padding:4px 9px; }
.lp-palhint{ padding:13px 16px 6px; font-size:12px; color:var(--text2); line-height:1.55; }
.lp-palex{ padding:0 16px 15px; font-size:11.5px; color:var(--text3); font-family:'IBM Plex Mono',monospace; }
.lp-palex em{ font-style:normal; color:var(--dieline); }

/* ---------- intro ---------- */
.lp-introwrap{ position:fixed; inset:0; z-index:70; background:radial-gradient(1100px 620px at 50% -12%, #17222E, #080C11); display:flex; align-items:center; justify-content:center; padding:20px; animation:lp-fade .3s ease; }
.lp-skip{ position:absolute; top:18px; right:20px; background:transparent; color:var(--text2); border:1px solid var(--rule); border-radius:6px; padding:7px 12px; font-size:11.5px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-family:inherit; transition:all .14s; }
.lp-skip:hover{ background:var(--panel2); color:var(--text); }
.lp-introcard{ width:min(940px,96vw); }
.lp-introhead{ text-align:center; margin-bottom:16px; }
.lp-introkick{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.4em; color:var(--dieline); margin-bottom:10px; text-transform:uppercase; }
.lp-introttl{ font-family:'Bricolage Grotesque',sans-serif; font-weight:700; font-size:30px; color:#fff; letter-spacing:-0.025em; }
.lp-introsub{ font-size:13.5px; color:var(--text2); margin-top:7px; }
.lp-introsvg{ background:var(--paper); border-radius:10px; padding:18px; box-shadow:0 40px 90px rgba(0,0,0,0.6); }
.lp-introcta{ text-align:center; margin-top:20px; animation:lp-fade .4s ease; }
.lp-ctatext{ font-size:13.5px; color:var(--text2); max-width:56ch; margin:0 auto 16px; line-height:1.6; }
.lp-enter{ background:var(--seal); color:#fff; border:none; border-radius:8px; padding:12px 24px; font-size:14.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:9px; font-family:inherit; box-shadow:0 10px 30px rgba(229,57,155,0.35); transition:filter .14s, transform .14s; }
.lp-enter:hover{ filter:brightness(1.08); transform:translateY(-1px); }
@keyframes lp-fade{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none;} }

/* ---------- 3D viewer, sitting on the same lit stage ---------- */
.v3-shell{ position:relative; background:radial-gradient(120% 100% at 50% 0%, #FAFBFC 0%, #E6EBEF 55%, #CFD7DE 100%); border-radius:0; overflow:hidden; }
.v3-canvas{ width:100%; height:min(56vh,500px); touch-action:none; }
.v3-controls{ position:absolute; top:13px; right:13px; display:flex; flex-wrap:wrap; gap:5px; justify-content:flex-end; max-width:72%; }
.v3-controls button{
  background:rgba(13,18,24,0.78); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.14); border-radius:6px; padding:6px 10px; font-size:11px;
  cursor:pointer; color:#D8DEE5; font-family:inherit; display:inline-flex; align-items:center; gap:5px; transition:all .14s;
}
.v3-controls button:hover{ background:rgba(13,18,24,0.92); color:#fff; }
.v3-controls button.on{ background:var(--seal); color:#fff; border-color:var(--seal); }
.v3-hint{ position:absolute; bottom:13px; left:14px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.06em; color:#5C6A79; background:rgba(255,255,255,0.72); padding:5px 10px; border-radius:5px; }
.v3-tip{ position:absolute; z-index:6; max-width:270px; background:#0D1218; border:1px solid #26333F; border-left:2px solid var(--dieline); border-radius:7px; padding:11px 13px; box-shadow:0 14px 40px rgba(0,0,0,0.45); pointer-events:none; }
.v3-tip-h{ font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:12.5px; color:#E7ECF1; }
.v3-tip-c{ font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--dieline); margin-top:3px; }
.v3-tip-w{ font-size:11.5px; color:#93A3B3; margin-top:5px; line-height:1.45; }
.v3-tip-x{ font-size:11px; color:#F08472; margin-top:5px; line-height:1.45; }
.v3-fail{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:30px; color:#4C5A6B; font-size:13px; }

/* ---------- zone annotation: numbered pins, leader, callout ---------- */
.v3-pins{ position:absolute; inset:0; pointer-events:none; z-index:5; }
.v3-pins.off{ display:none; }
.v3-pin{
  position:absolute; left:0; top:0; width:22px; height:22px; border-radius:50%;
  border:1px solid rgba(13,18,24,0.22); background:rgba(255,255,255,0.92);
  color:#16243B; font-family:'IBM Plex Mono',monospace; font-size:10.5px; font-weight:600;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 3px 12px rgba(13,18,24,0.22); pointer-events:auto;
  transition:opacity .25s ease, background .16s, color .16s, box-shadow .16s;
  will-change:transform;
}
/* The visible pin stays 22px so it doesn't cover the artwork, but the
   hit area is expanded to 44px for touch. */
.v3-pin::before{ content:''; position:absolute; inset:-11px; border-radius:50%; }
.v3-pin::after{
  content:''; position:absolute; inset:-6px; border-radius:50%;
  border:1px solid var(--dieline); opacity:0; transition:opacity .2s, transform .3s; transform:scale(.8);
}
@media (pointer:coarse){
  .v3-pin{ width:26px; height:26px; font-size:11.5px; }
  .v3-pin::before{ inset:-14px; }
}
.v3-pin:hover{ background:#0D1218; color:#fff; }
.v3-pin.on{ background:var(--dieline); color:#062028; box-shadow:0 4px 18px rgba(63,208,232,0.5); }
.v3-pin.on::after{ opacity:.85; transform:scale(1); }

.v3-lead{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:4; }
.v3-lead line{ stroke:var(--dieline); stroke-width:1; stroke-dasharray:3 4; opacity:0; transition:opacity .25s ease; }

.v3-call{
  position:absolute; left:16px; top:50%; transform:translateY(-50%); z-index:7;
  width:min(292px,42%); background:rgba(13,18,24,0.93);
  -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  border:1px solid #26333F; border-radius:10px; padding:15px 16px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5); animation:v3-call-in .32s cubic-bezier(.2,.7,.2,1);
}
@keyframes v3-call-in{ from{ opacity:0; transform:translateY(-50%) translateX(-10px); } to{ opacity:1; transform:translateY(-50%); } }
.v3-call-n{ font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:var(--dieline); }
.v3-call-h{ font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:16px; color:#E7ECF1; margin-top:7px; letter-spacing:-0.015em; line-height:1.2; }
.v3-call-c{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#7F8FA0; margin-top:5px; }
.v3-call-w{ font-size:12.5px; color:#B7C3CF; margin-top:10px; line-height:1.5; }
.v3-call-x{ font-size:11.5px; color:#F08472; margin-top:9px; line-height:1.45; padding-top:9px; border-top:1px solid #222E39; }
.v3-call-nav{ display:flex; gap:6px; margin-top:13px; }
.v3-call-nav button{
  flex:none; border:1px solid #2B3844; background:transparent; color:#93A3B3;
  border-radius:6px; padding:6px 11px; font-size:11.5px; cursor:pointer;
  font-family:inherit; display:inline-flex; align-items:center; gap:4px; transition:all .14s;
}
.v3-call-nav button:hover{ background:#1C2733; color:#E7ECF1; }
.v3-call-nav button.p{ flex:1; justify-content:center; background:var(--dieline); color:#062028; border-color:var(--dieline); font-weight:600; }
.v3-call-nav button.p:hover{ filter:brightness(1.08); background:var(--dieline); color:#062028; }

.v3-tourcta{
  position:absolute; left:50%; bottom:16px; transform:translateX(-50%); z-index:6;
  background:rgba(13,18,24,0.86); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  color:#D8DEE5; border:1px solid rgba(255,255,255,0.16); border-radius:999px;
  padding:9px 18px; font-size:11.5px; font-family:'IBM Plex Mono',monospace;
  letter-spacing:0.06em; cursor:pointer; transition:all .16s;
}
.v3-tourcta:hover{ background:var(--dieline); color:#062028; border-color:var(--dieline); }

/* ---------- dieline view ---------- */
.dl-wrap{ padding:18px; color:#16243B; }
.dl-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:12px; }
.dl-kicker{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.18em; text-transform:uppercase; color:#8A97A3; }
.dl-title{ font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:17px; color:#16243B; margin-top:3px; }
.dl-dl{ flex:none; border:1px solid var(--rule); background:var(--panel2); color:#16243B; border-radius:7px; padding:7px 12px; font-size:11.5px; cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-family:inherit; transition:all .14s; }
.dl-dl:hover{ background:var(--ink); color:#fff; border-color:var(--ink); }
.dl-legend{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px; font-family:'IBM Plex Mono',monospace; font-size:10px; color:#5A6976; }
.dl-legend span{ display:inline-flex; align-items:center; gap:7px; }
.dl-legend i{ width:20px; height:0; display:inline-block; }
.dl-ln-cut{ border-top:1.4px solid #16243B; }
.dl-ln-fold{ border-top:1.4px dashed var(--seal); }
.dl-ln-glue{ border-top:1.4px dotted #16243B; opacity:0.6; }
.dl-canvas{ background:#fff; border:1px solid var(--rule); border-radius:10px; padding:14px; overflow:hidden; }
.dl-canvas svg{ display:block; max-height:340px; }
.dl-controls{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:16px; }
.dl-ctl label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:#5A6976; margin-bottom:7px; }
.dl-ctl input[type=range]{ width:100%; accent-color:var(--seal); }
@media (max-width:620px){ .dl-controls{ grid-template-columns:1fr; } }
.dl-note{ margin-top:14px; font-size:11.5px; color:#6E7E90; line-height:1.55; }

/* ---------- carton studio ---------- */
.dl-studio{ display:grid; grid-template-columns:1fr 1fr; gap:22px; margin-top:20px; padding-top:18px; border-top:1px solid var(--rule); }
@media (max-width:760px){ .dl-studio{ grid-template-columns:1fr; } }
.dl-sub{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:#5A6976; margin-bottom:10px; }
.dl-chips{ display:flex; flex-wrap:wrap; gap:6px; }
.dl-chip{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--rule); background:#fff; color:#16243B; border-radius:6px; padding:7px 11px; font-size:11.5px; cursor:pointer; font-family:inherit; transition:all .14s; }
.dl-chip i{ width:12px; height:12px; border-radius:3px; border:1px solid rgba(0,0,0,0.2); }
.dl-chip:hover{ border-color:#16243B; }
.dl-chip.on{ background:#16243B; color:#fff; border-color:#16243B; }
.dl-input{ width:100%; margin-bottom:7px; border:1px solid var(--rule); border-radius:6px; padding:8px 10px; font-size:12.5px; font-family:'IBM Plex Mono',monospace; color:#16243B; background:#fff; }
.dl-input:focus{ outline:none; border-color:var(--seal); }
.dl-hint{ font-size:11px; color:#6E7E90; line-height:1.5; margin-top:6px; }

/* the colour circle */
.fw{ display:flex; flex-direction:column; align-items:flex-start; }
.fw-svg{ width:192px; height:192px; }
.fw-seg{ cursor:pointer; stroke:#fff; stroke-width:1.5; transition:transform .16s, opacity .16s; transform-origin:96px 96px; }
.fw-seg:hover{ opacity:0.82; transform:scale(1.035); }
.fw-seg.on{ stroke:#16243B; stroke-width:2.5; }
.fw-core{ font-family:'IBM Plex Mono',monospace; font-size:11px; fill:#fff; font-weight:600; paint-order:stroke; stroke:rgba(0,0,0,0.28); stroke-width:2.5px; }
.fw-meta{ margin-top:12px; }
.fw-name{ font-family:'Bricolage Grotesque',sans-serif; font-weight:600; font-size:14.5px; color:#16243B; }
.fw-common{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#5A6976; margin-top:3px; }
.fw-cite{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--seal); margin-top:5px; }
.fw-use{ font-size:11.5px; color:#4C5A6B; margin-top:6px; line-height:1.5; max-width:34ch; }
.fw-note{ font-size:10.5px; color:#8A97A3; margin-top:10px; line-height:1.5; max-width:36ch; }

.skin-panel .dl-chip, .skin-panel .dl-input{ border:1px solid #000; border-radius:0; color:#000; }
.skin-panel .dl-chip.on{ background:#000; color:#fff; }
.skin-panel .fw-name, .skin-panel .fw-common, .skin-panel .fw-use, .skin-panel .fw-note{ color:#000; font-family:inherit; }
.skin-panel .fw-seg{ stroke:#000; }
.skin-panel .dl-sub{ font-family:inherit; font-weight:700; text-transform:none; letter-spacing:0; color:#000; }

@media (max-width:760px){
  .v3-call{ left:10px; right:10px; width:auto; top:auto; bottom:10px; transform:none; }
  @keyframes v3-call-in{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }
}

/* ---------- narrow screens fall back to normal document flow ---------- */
@media (max-width:1000px){
  .lp-root{ height:auto; overflow:visible; }
  /* On a phone the pack leads and the controls follow. Left as a grid the
     spec rail pushed the artwork a full screen below the fold. */
  .lp-grid{ display:flex; flex-direction:column; grid-template-columns:1fr; }
  .lp-main{ order:1; overflow:visible; }
  .lp-panel{ order:2; border-right:none; border-top:1px solid var(--rule); overflow:visible; }
  .lp-head{ height:auto; padding:14px 16px; flex-wrap:wrap; }
  .lp-preview{ padding:18px; }
  .lp-shead{ height:auto; padding:12px 16px; }
}
@media (max-width:760px){
  /* the strip was clipping mid-word; drop the label and keep the count */
  .lp-strip span{ padding:0 9px; font-size:9px; }
  .lp-strip span .w{ display:none; }
  /* the hint duplicates what the tour button already says on touch */
  .v3-hint{ display:none; }
  .v3-tourcta{ bottom:12px; }
  .v3-controls{ max-width:none; left:10px; right:10px; justify-content:center; }
}
/* =====================================================================
   SKIN: MONOGRAPH
   The Drug Facts panel is one of the few pieces of legally mandated
   graphic design in existence: FDA specifies the type family, the
   minimum sizes, the leading, the hairline weights, and the solid bars
   between blocks. So the tool that teaches labelling law is typeset to
   those rules. Black on white, one rule weight, and a single signal
   colour used only for the element under examination. If someone asks
   why it looks like this, the answer is a citation.
   ===================================================================== */
.lp-root.skin-panel{
  --ink:#000000; --panel:#FFFFFF; --panel2:#FFFFFF; --raise:#F2F2F2;
  --rule:#000000; --rule2:#BFBFBF;
  --text:#000000; --text2:#000000; --text3:#595959;
  --paper:#FFFFFF; --shell:#FFFFFF;
  --dieline:#000000; --seal:#D8318C;
  --mand:#000000; --cond:#000000; --recc:#595959;
  font-family:'Helvetica Neue',Helvetica,Arial,'Liberation Sans',sans-serif;
  background:#E8E8E8;
}
.skin-panel .lp-head{ background:#fff; border-bottom:4px solid #000; box-shadow:none; }
.skin-panel .lp-logo{ font-family:inherit; font-weight:700; letter-spacing:-0.02em; }
.skin-panel .lp-logo em{ color:#000; }
.skin-panel .lp-logo b{ font-family:inherit; font-weight:400; color:#000; border-left:1px solid #000; }
.skin-panel .lp-tag{ color:#000; }
.skin-panel .lp-tool{ border:1px solid #000; border-radius:0; color:#000; background:#fff; font-family:inherit; }
.skin-panel .lp-tool:hover{ background:#000; color:#fff; }
.skin-panel .lp-tool.on{ background:#000; color:#fff; border-color:#000; }

.skin-panel .lp-panel{ padding:0; border-right:1px solid #000; }
.skin-panel .lp-panel > .lp-sec{ border:none; border-bottom:1px solid #000; border-radius:0; margin:0; box-shadow:none; }
.skin-panel .lp-main{ padding:0; gap:0; }

/* section heads take the panel's bar-and-rule treatment */
.skin-panel .lp-step{
  font-family:inherit; font-weight:700; font-size:12px; letter-spacing:0;
  text-transform:none; color:#000; padding:0 0 4px 0; margin-bottom:10px;
  border-bottom:1px solid #000;
}
.skin-panel .lp-step::before{ display:none; }

.skin-panel .lp-chip, .skin-panel .lp-attr, .skin-panel .lp-segb{
  border:1px solid #000; border-radius:0; background:#fff; color:#000; font-family:inherit;
}
.skin-panel .lp-chip:hover, .skin-panel .lp-attr:hover, .skin-panel .lp-segb:hover{ background:#F2F2F2; color:#000; }
.skin-panel .lp-chip.on, .skin-panel .lp-attr.on, .skin-panel .lp-segb.on{ background:#000; color:#fff; border-color:#000; }
.skin-panel .lp-field label{ font-family:inherit; font-weight:700; font-size:10px; letter-spacing:0; color:#000; text-transform:none; }
.skin-panel .lp-field input{ border:1px solid #000; border-radius:0; background:#fff; font-family:inherit; color:#000; }
.skin-panel .lp-field input:focus{ box-shadow:none; border-color:var(--seal); border-width:2px; }
.skin-panel .lp-swlabel{ font-family:inherit; font-weight:700; text-transform:none; letter-spacing:0; color:#000; font-size:10px; }
.skin-panel .lp-sw{ border-radius:0; border:1px solid #000; }
.skin-panel .lp-sw.on{ box-shadow:0 0 0 3px #fff, 0 0 0 5px var(--seal); }

.skin-panel .lp-stage{ border:1px solid #000; border-radius:0; box-shadow:none; margin:0; }
.skin-panel .lp-shead{ background:#fff; border-bottom:1px solid #000; }
.skin-panel .lp-crumb{ font-family:inherit; color:#000; }
.skin-panel .lp-vtoggle{ background:#fff; border:1px solid #000; border-radius:0; padding:0; }
.skin-panel .lp-vt{ border-radius:0; color:#000; font-family:inherit; border-right:1px solid #000; }
.skin-panel .lp-vt:last-child{ border-right:none; }
.skin-panel .lp-vt.on{ background:#000; color:#fff; border-color:#000; }

/* the strip becomes the panel's solid separator bar */
.skin-panel .lp-strip{ height:22px; background:#fff; border-bottom:7px solid #000; font-family:inherit; }
.skin-panel .lp-strip span{ border-right:1px solid #000; color:#000; font-size:9.5px; letter-spacing:0; text-transform:none; }
.skin-panel .lp-strip span::before{ display:none; }
.skin-panel .lp-strip em{ font-weight:700; }

.skin-panel .lp-preview{ background:#fff; }
.skin-panel .lp-reg i{ display:none; }

/* the ledger set as the panel's own hierarchy: weight and indent, not colour */
.skin-panel .lp-comp{ border:1px solid #000; border-top:none; border-radius:0; box-shadow:none; }
.skin-panel .lp-comph{ font-family:inherit; font-weight:700; font-size:19px; border-bottom:7px solid #000; padding-bottom:5px; letter-spacing:-0.01em; }
.skin-panel .lp-counts em{ border-radius:0; background:#fff !important; color:#000 !important; border:1px solid #000; font-family:inherit; }
.skin-panel .lp-crow{ border-radius:0; border-bottom:1px solid #000; box-shadow:none; padding:9px 0; }
.skin-panel .lp-crow:hover{ background:#F2F2F2; }
.skin-panel .lp-crow.active{ background:#fff; box-shadow:inset 3px 0 0 var(--seal); padding-left:9px; }
.skin-panel .lp-cdot{ display:none; }
.skin-panel .lp-cn{ font-weight:700; font-size:13px; }
.skin-panel .lp-cc{ font-family:inherit; color:#000; font-size:11px; }
.skin-panel .lp-cnote{ color:#000; font-style:italic; }
/* status carried by weight and case, the way the panel itself does it */
.skin-panel .lp-cst{ background:#fff !important; color:#000 !important; border:1px solid #000; border-radius:0; font-family:inherit; font-weight:700; letter-spacing:0; }
.skin-panel .lp-crow .lp-cst{ text-transform:uppercase; }
.skin-panel .lp-honesty, .skin-panel .lp-audnote{ color:#000; border-top:1px solid #000; }
.skin-panel .lp-audit{ border:1px solid #000; border-radius:0; box-shadow:none; }
.skin-panel .lp-audhead{ font-family:inherit; font-weight:700; border-bottom:7px solid #000; padding-bottom:5px; }
.skin-panel .lp-obsn{ border-radius:0; border:1px solid #000; color:#000; font-family:inherit; }
.skin-panel .lp-obs{ color:#000; border-bottom:1px solid #000; }
.skin-panel .lp-foot{ background:#fff; border-top:4px solid #000; color:#000; font-family:inherit; letter-spacing:0; text-transform:none; }

/* the stage: paper, not a lit booth */
.skin-panel .v3-shell{ background:#FFFFFF; }
.skin-panel .v3-controls button{ background:#fff; border:1px solid #000; border-radius:0; color:#000; }
.skin-panel .v3-controls button:hover{ background:#000; color:#fff; }
.skin-panel .v3-controls button.on{ background:#000; color:#fff; }
.skin-panel .v3-hint{ background:#fff; border:1px solid #000; border-radius:0; color:#000; font-family:inherit; }
.skin-panel .v3-pin{ background:#fff; border:1px solid #000; color:#000; box-shadow:none; font-family:inherit; font-weight:700; }
.skin-panel .v3-pin.on{ background:var(--seal); color:#fff; border-color:var(--seal); box-shadow:none; }
.skin-panel .v3-pin::after{ border-color:var(--seal); }
.skin-panel .v3-lead line{ stroke:var(--seal); stroke-dasharray:none; }
.skin-panel .v3-call{ background:#fff; border:1px solid #000; border-left:5px solid var(--seal); border-radius:0; box-shadow:none; backdrop-filter:none; }
.skin-panel .v3-call-n{ color:#000; font-family:inherit; font-weight:700; }
.skin-panel .v3-call-h{ font-family:inherit; font-weight:700; color:#000; border-bottom:1px solid #000; padding-bottom:5px; }
.skin-panel .v3-call-c{ font-family:inherit; color:#000; }
.skin-panel .v3-call-w{ color:#000; }
.skin-panel .v3-call-x{ color:#000; font-weight:700; border-top:1px solid #000; }
.skin-panel .v3-call-nav button{ border:1px solid #000; border-radius:0; color:#000; font-family:inherit; }
.skin-panel .v3-call-nav button.p{ background:#000; color:#fff; border-color:#000; }
.skin-panel .v3-tourcta{ background:#fff; border:1px solid #000; border-radius:0; color:#000; font-family:inherit; }
.skin-panel .v3-tourcta:hover{ background:#000; color:#fff; border-color:#000; }
.skin-panel .dl-title, .skin-panel .dl-kicker{ font-family:inherit; color:#000; }
.skin-panel .dl-dl, .skin-panel .dl-canvas{ border:1px solid #000; border-radius:0; }
.skin-panel .lp-introwrap{ background:#fff; }
.skin-panel .lp-introttl{ font-family:inherit; color:#000; }
.skin-panel .lp-introkick{ color:#000; }
.skin-panel .lp-introsub, .skin-panel .lp-ctatext{ color:#000; }
.skin-panel .lp-enter{ border-radius:0; box-shadow:none; }
.skin-panel .lp-skip{ border-radius:0; border:1px solid #000; color:#000; }
.skin-panel .lp-palbox{ border-radius:0; border:1px solid #000; }

@media (prefers-reduced-motion: reduce){
  .lp-root *, .lp-introwrap *, .lp-palette *{ animation:none !important; transition:none !important; }
  .lp-reg i{ opacity:.3; }
}
